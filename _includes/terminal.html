{% assign terminal_id = include.title | slugify | append: '-' | append: include.language | append: '-' | append: include.title.size | append: include.content.size %}
<div class="terminal" data-language="{{ include.language }}" id="terminal-{{ terminal_id }}">
  <div class="terminal__header{% if include.language == 'browser' %} terminal__header--browser{% endif %}">
    <div class="terminal__controls">
      <button class="terminal__dot terminal__dot--red" onclick="terminalClose('{{ terminal_id }}')" title="Close"></button>
      <button class="terminal__dot terminal__dot--yellow" onclick="terminalMinimize('{{ terminal_id }}')" title="Minimize"></button>
      <button class="terminal__dot terminal__dot--green" onclick="terminalMaximize('{{ terminal_id }}')" title="Maximize"></button>
    </div>
    <span class="terminal__title">{{ include.title }}</span>
    <button class="terminal__copy" onclick="terminalCopy('{{ terminal_id }}')" title="Copy to clipboard">
      <svg class="terminal__copy-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="terminal__copy-label">copy</span>
    </button>
  </div>
  <pre class="terminal__body" id="terminal-body-{{ terminal_id }}">{{ include.content | escape }}</pre>
</div>

<!-- Maximize overlay -->
<div class="terminal__overlay" id="overlay-{{ terminal_id }}" onclick="terminalOverlayClose('{{ terminal_id }}')">
  <div class="terminal__modal" onclick="event.stopPropagation()">
    <div class="terminal__header{% if include.language == 'browser' %} terminal__header--browser{% endif %}">
      <div class="terminal__controls">
        <button class="terminal__dot terminal__dot--red" onclick="terminalOverlayClose('{{ terminal_id }}')" title="Close"></button>
        <button class="terminal__dot terminal__dot--yellow" title="Minimize"></button>
        <button class="terminal__dot terminal__dot--green" onclick="terminalOverlayClose('{{ terminal_id }}')" title="Restore"></button>
      </div>
      <span class="terminal__title">{{ include.title }}</span>
      <button class="terminal__copy" onclick="terminalCopyModal('{{ terminal_id }}')" title="Copy to clipboard">
        <svg class="terminal__copy-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span class="terminal__copy-label">copy</span>
      </button>
    </div>
    <pre class="terminal__body terminal__body--modal" id="terminal-modal-body-{{ terminal_id }}" data-language="{{ include.language }}">{{ include.content | escape }}</pre>
  </div>
</div>
